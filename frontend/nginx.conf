server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Serve the React app ───
    # For any route that doesn't match a real file, serve index.html
    # (required for single-page app client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Proxy API calls to the backend container ───
    # Any request to /api/* gets forwarded to the backend service
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Cache static assets ───
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
